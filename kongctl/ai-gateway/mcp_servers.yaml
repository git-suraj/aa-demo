_defaults:
  kongctl:
    namespace: ai-gateway-mcp-servers
ai_gateway_mcp_servers:
  # Focused Delegated Agent Access scene. Kong validates the Keycloak token
  # through the OIDC identity provider. DataKit evaluates the exchanged
  # token's user-specific `delegated_tool_scopes` claim before proxying each
  # MCP call because AI Gateway 2.0 does not currently expose the validated
  # token claims to its native oauth_access_token ACL context.
  - access:
      # Keep OIDC validation on the MCP listener. No Consumer or tool ACLs are
      # configured: DataKit authorizes the exchanged token scope first.
      acl_attribute_type: consumer
      identity_providers:
        - delegated-keycloak-oidc
    ai_gateway: !ref ai-gateway#id
    config:
      logging:
        audits: true
        payloads: true
      max_request_body_size: 8192
      route:
        paths:
          - /delegated-mcp
        preserve_host: false
        protocols:
          - http
          - https
        strip_path: false
      server:
        forward_client_headers: true
        timeout: 10000
      url: http://identity-bank-api:8000
    display_name: Delegated banking MCP
    name: delegated-portfolio-mcp
    ref: delegated-portfolio-mcp
    tools:
      - annotations:
          read_only_hint: true
          title: Delegated Customer Portfolio
        description: Get the portfolio only for the customer bound into the delegated token.
        method: GET
        name: get_customer_portfolio
        parameters:
          - description: Customer ID permitted by the delegated token
            in: path
            name: customer_id
            required: true
            schema:
              type: string
        path: /portfolio/{customer_id}
      - annotations:
          destructive_hint: true
          title: Initiate Payment
        description: Initiate a payment for the customer bound into the delegated token.
        method: POST
        name: initiate_payment
        path: /payments/initiate
        request_body:
          content:
            application/json:
              schema:
                type: object
                required:
                  - customer_id
                  - amount_usd
                properties:
                  customer_id:
                    description: Customer ID permitted by the delegated token
                    type: string
                  amount_usd:
                    description: Payment amount in USD
                    type: number
    type: conversion-listener

  - access:
      acl_attribute_type: consumer
      identity_providers:
        - demo-key-auth
    ai_gateway: !ref ai-gateway#id
    config:
      logging:
        audits: false
        payloads: true
      max_request_body_size: 8192
      route:
        paths:
          - /mock-mcp
        preserve_host: false
        protocols:
          - http
          - https
        strip_path: false
      server:
        consumer_identifier: username
        forward_client_headers: true
        include_consumer_groups: true
        timeout: 10000
      url: http://mock-api:8000
    display_name: mock-api-service
    name: mock-api-service
    ref: mock-api-service
    tools:
      - access:
          acls:
            allow:
              - orchestrator-tools
        annotations:
          title: Customer Account
        description: Get account metadata and current health signals
        method: GET
        name: get_customer_account
        parameters:
          - description: Customer ID
            in: path
            name: customer_id
            required: true
            schema:
              type: string
        path: /api/customers/{customer_id}
      - access:
          acls:
            allow:
              - orchestrator-tools
        annotations:
          title: Renewal Risk
        description: Get renewal risk and contributing factors
        method: GET
        name: get_renewal_risk
        parameters:
          - description: Customer ID
            in: path
            name: customer_id
            required: true
            schema:
              type: string
        path: /api/customers/{customer_id}/renewal-risk
      - access:
          acls:
            allow:
              - orchestrator-tools
        annotations:
          title: Open Tickets
        description: Get open support tickets for the customer
        method: GET
        name: get_open_tickets
        parameters:
          - description: Customer ID
            in: path
            name: customer_id
            required: true
            schema:
              type: string
        path: /api/customers/{customer_id}/tickets
      - access:
          acls:
            allow:
              - support-tools
        annotations:
          title: Incident Status
        description: Get current incident status and impact
        method: GET
        name: get_incident_status
        parameters:
          - description: Incident ID
            in: path
            name: incident_id
            required: true
            schema:
              type: string
        path: /api/incidents/{incident_id}
      - access:
          acls:
            allow:
              - support-tools
        annotations:
          title: Runbook Search
        description: Search operational runbooks
        method: GET
        name: search_runbook
        parameters:
          - description: Search query
            in: query
            name: q
            required: true
            schema:
              type: string
        path: /api/runbooks/search
      - access:
          acls:
            allow:
              - success-tools
        annotations:
          title: Draft Customer Reply
        description: Draft a customer-facing reply
        method: GET
        name: draft_customer_reply
        parameters:
          - in: query
            name: account_name
            required: true
            schema:
              type: string
          - in: query
            name: csm
            required: true
            schema:
              type: string
          - in: query
            name: issue_summary
            required: true
            schema:
              type: string
          - in: query
            name: renewal_risk
            required: true
            schema:
              type: string
          - in: query
            name: technical_summary
            required: true
            schema:
              type: string
        path: /api/drafts/customer-reply/preview
      - access:
          acls:
            allow:
              - success-tools
        annotations:
          title: Create Follow-up Task
        description: Create a success-team follow-up task
        method: GET
        name: create_followup_task
        parameters:
          - in: query
            name: account_name
            required: true
            schema:
              type: string
          - in: query
            name: owner
            required: true
            schema:
              type: string
          - in: query
            name: due_date
            required: true
            schema:
              type: string
          - in: query
            name: action_items
            required: false
            schema:
              type: string
        path: /api/tasks/followup/preview
    type: conversion-listener
