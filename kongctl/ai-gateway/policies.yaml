  - ai_gateway: !ref ai-gateway#id
    config:
      debug: false
      nodes:
        - input: request.body
          inputs: null
          jq: |
            ({"model": "gpt-4o-mini", "messages": .messages})
          name: EXTRACT_PROMPT
          output: null
          type: jq
        - input: request.headers
          inputs: null
          jq: |
            {
              apikey: (.apikey // .Apikey // ."api-key" // ."Api-Key" // ""),
              "x-demo-run-id": (."x-demo-run-id" // ."X-Demo-Run-Id" // ""),
              "x-demo-context-id": (."x-demo-context-id" // ."X-Demo-Context-Id" // ""),
              traceparent: (.traceparent // ""),
              tracestate: (.tracestate // ""),
              baggage: (.baggage // "")
            }
          name: EXTRACT_HEADERS
          output: null
          type: jq
        - input: null
          inputs:
            body: EXTRACT_PROMPT
            headers: EXTRACT_HEADERS
            http_proxy: null
            https_proxy: null
            proxy_auth_password: null
            proxy_auth_username: null
            query: null
            url: null
          method: POST
          name: CALL_MODEL_SELECTOR
          output: null
          outputs: null
          ssl_server_name: null
          ssl_verify: true
          timeout: null
          type: call
          url: http://localhost:8000/ai/orchestrator-model-selector/chat/completions
        - input: null
          inputs:
            body: CALL_MODEL_SELECTOR.body
          jq: |
            (
              .body.choices[0].message.content
              | if type == "array" then map(.text // "") | join(" ") else . end
              | tostring
              | ascii_downcase
              | gsub("[^a-z]"; " ")
              | if test("complex") then "complex" else "simple" end
            )
          name: EXTRACT_MODEL
          output: null
          type: jq
        - input: EXTRACT_MODEL
          inputs: null
          jq: '. == "complex"'
          name: IS_COMPLEX
          output: null
          type: jq
        - input: null
          inputs:
            original: request.body
            selected: EXTRACT_MODEL
          jq: |
            . as $in | $in.original | .model = "complex"
          name: BUILD_COMPLEX_REQUEST
          output: null
          type: jq
        - input: null
          inputs:
            original: request.body
            selected: EXTRACT_MODEL
          jq: |
            . as $in | $in.original | .model = "simple"
          name: BUILD_SIMPLE_REQUEST
          output: null
          type: jq
        - else:
            - CALL_SIMPLE
          input: IS_COMPLEX
          name: ROUTE_MODEL
          output: null
          outputs: null
          then:
            - CALL_COMPLEX
          type: branch
        - input: null
          inputs:
            body: BUILD_COMPLEX_REQUEST
            headers: EXTRACT_HEADERS
            http_proxy: null
            https_proxy: null
            proxy_auth_password: null
            proxy_auth_username: null
            query: null
            url: null
          method: POST
          name: CALL_COMPLEX
          output: null
          outputs: null
          ssl_server_name: null
          ssl_verify: true
          timeout: 120000
          type: call
          url: http://localhost:8000/ai/orchestrator-model-based-complex/chat/completions
        - input: null
          inputs:
            body: BUILD_SIMPLE_REQUEST
            headers: EXTRACT_HEADERS
            http_proxy: null
            https_proxy: null
            proxy_auth_password: null
            proxy_auth_username: null
            query: null
            url: null
          method: POST
          name: CALL_SIMPLE
          output: null
          outputs: null
          ssl_server_name: null
          ssl_verify: true
          timeout: 120000
          type: call
          url: http://localhost:8000/ai/orchestrator-model-based-simple/chat/completions
        - input: null
          inputs:
            complex: CALL_COMPLEX.body
            selected: EXTRACT_MODEL
            simple: CALL_SIMPLE.body
          jq: |
            if .selected == "complex" then .complex else .simple end
          name: SELECT_RESPONSE
          output: null
          type: jq
        - input: null
          inputs:
            body: SELECT_RESPONSE
            headers: null
          name: RETURN_RESPONSE
          status: 200
          type: exit
          warn_headers_sent: null
      resources: null
