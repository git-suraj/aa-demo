auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false

# Native AI Gateway OTEL access logs contain the completed ai.* record. Keep
# that structured payload intact for the demo's LLM and MCP input/output log
# streams instead of dropping records at Loki's default 128-field limit.
limits_config:
  max_structured_metadata_entries_count: 512

ruler:
  alertmanager_url: http://localhost:9093
